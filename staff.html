    <script>

        /* =========================
           MOBILE MENU
        ========================= */

        const menuToggle =
            document.getElementById("menuToggle");

        const mobileMenu =
            document.getElementById("mobileMenu");


        menuToggle.addEventListener("click", function () {

            mobileMenu.classList.toggle("active");

            const icon =
                menuToggle.querySelector("i");


            if (mobileMenu.classList.contains("active")) {

                icon.classList.remove("fa-bars");

                icon.classList.add("fa-xmark");

            } else {

                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            }

        });



        /* =========================
           CLOSE MOBILE MENU
        ========================= */

        const mobileLinks =
            mobileMenu.querySelectorAll("a");


        mobileLinks.forEach(function (link) {

            link.addEventListener("click", function () {

                mobileMenu.classList.remove("active");

                const icon =
                    menuToggle.querySelector("i");


                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            });

        });



        /* =========================
           CLOSE ON OUTSIDE TAP
        ========================= */

        document.addEventListener("click", function (e) {

            const clickedInsideMenu =
                mobileMenu.contains(e.target);

            const clickedToggle =
                menuToggle.contains(e.target);


            if (
                !clickedInsideMenu &&
                !clickedToggle &&
                mobileMenu.classList.contains("active")
            ) {

                mobileMenu.classList.remove("active");

                const icon =
                    menuToggle.querySelector("i");

                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            }

        });



        /* =========================
           THEME TOGGLE
        ========================= */

        const themeBtn =
            document.getElementById("themeBtn");

        const themeIcon =
            themeBtn.querySelector("i");


        /* Load saved theme */

        let savedTheme = null;

        try {
            savedTheme = localStorage.getItem("sparkTheme");
        } catch (error) {}


        if (savedTheme === "dark") {

            document.body.classList.add("dark");

            themeIcon.classList.remove("fa-sun");

            themeIcon.classList.add("fa-moon");

        }



        /* Theme button */

        themeBtn.addEventListener("click", function () {

            document.body.classList.toggle("dark");


            const isDark =
                document.body.classList.contains("dark");


            if (isDark) {

                themeIcon.classList.remove("fa-sun");

                themeIcon.classList.add("fa-moon");


                try {
                    localStorage.setItem("sparkTheme", "dark");
                } catch (error) {}

            } else {

                themeIcon.classList.remove("fa-moon");

                themeIcon.classList.add("fa-sun");


                try {
                    localStorage.setItem("sparkTheme", "light");
                } catch (error) {}

            }

        });



        /* =========================
           ACTIVE NAV LINK
        ========================= */

        const allNavLinks =
            document.querySelectorAll(
                ".nav-menu a, .mobile-menu a:not(#mobileLoginBtn)"
            );


        function cleanPage(path) {

            let page = path.split("#")[0].split("/").pop();

            page = page.replace(/\.html$/, "");

            return page === "" ? "index" : page;

        }

        const currentPage = cleanPage(window.location.pathname);

        allNavLinks.forEach(function (link) {

            if (cleanPage(link.getAttribute("href")) === currentPage) {

                link.classList.add("active");

            }

        });



        /* =========================
           PLAY BUTTON
        ========================= */

        const playButtons =
            document.querySelectorAll(
                ".play-btn, .final-play-btn"
            );


        playButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                alert("Welcome to HEROS SMP!");

            });

        });

    </script>
